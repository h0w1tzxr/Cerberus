name: Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  assistant:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/assist')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/assist')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/assist')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '/assist') || contains(github.event.issue.title, '/assist')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run assistant
        id: assistant
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
